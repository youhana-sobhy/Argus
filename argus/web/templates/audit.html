{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-h">
    <h2>Audit trail</h2><span class="sub">Append-only record of sign-ins, AI questions, exports and every change action</span>
    <div class="right">
      <select class="input" id="a-action" style="width:200px;padding:7px 10px">
        <option value="">All actions</option><option value="auth">Sign-in / out</option><option value="chat">Assistant</option>
        <option value="inventory">Inventory &amp; export</option><option value="change">Changes</option><option value="admin">Admin</option>
      </select>
    </div>
  </div>
  <div class="card-b flush"><table class="t"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th>Outcome</th><th>Details</th></tr></thead>
    <tbody id="a-rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></div>
</div>
{% endblock %}
