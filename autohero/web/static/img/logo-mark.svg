<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AutoHero">
  <defs>
    <linearGradient id="ahg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0263A"/>
      <stop offset="1" stop-color="#B8001A"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ahg)"/>
  <!-- Original mark: an "A" drawn as a network path rising to a node (the hero summit) -->
