  <path d="M23 36 H38 l-4 -4 M38 36 l-4 4" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="15" r="5.2" fill="#fff"/>
  <circle cx="32" cy="15" r="2.2" fill="#E3051B"/>
