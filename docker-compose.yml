# AutoHero on-prem deployment.
#   docker compose up -d                       -> demo (SQLite, mock lab, offline AI)
#   docker compose --profile postgres up -d    -> adds PostgreSQL; set AUTOHERO_DATABASE_URL in .env
services:
  autohero:
    build: .
    image: autohero:0.1.0
    container_name: autohero
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AUTOHERO_RUNTIME_DIR: /data
      AUTOHERO_DATABASE_URL: ${AUTOHERO_DATABASE_URL:-sqlite:////data/autohero.db}
    volumes:
      - autohero-data:/data

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: autohero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: autohero
    volumes:
      - autohero-pg:/var/lib/postgresql/data

volumes:
  autohero-data:
  autohero-pg:
