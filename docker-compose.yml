# Argus on-prem deployment.
#   docker compose up -d                       -> demo (SQLite, mock lab, offline AI)
#   docker compose --profile postgres up -d    -> adds PostgreSQL; set ARGUS_DATABASE_URL in .env
services:
  argus:
    build: .
    image: argus:0.1.0
    container_name: argus
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ARGUS_RUNTIME_DIR: /data
      ARGUS_DATABASE_URL: ${ARGUS_DATABASE_URL:-sqlite:////data/argus.db}
    volumes:
      - argus-data:/data

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: argus
    volumes:
      - argus-pg:/var/lib/postgresql/data

volumes:
  argus-data:
  argus-pg:
