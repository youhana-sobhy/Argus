[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autohero"
version = "0.1.0"
description = "AutoHero - AI-assisted network automation platform (Cisco ACI MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.8"]
azure = ["openai>=3.0"]
ai = ["anthropic>=2.8", "openai>=3.0"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "anthropic>=2.8", "openai>=3.0"]

[project.scripts]
autohero = "autohero.cli:main"

[tool.setuptools.packages.find]
include = ["autohero*"]

[tool.setuptools.package-data]
autohero = ["web/templates/*.html", "web/static/**/*", "data/mock/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
